<!DOCTYPE html>
<html lang="en">

  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="icon" type="image/png" href="./image/favicon.png">
  <link rel="apple-touch-icon" href="./image/favicon.png">

</head>

<body>

 <header class="site-header">

  <div class="nav-inner">
   <!-- <div class="logo">Vic</div> -->
   
    <a class="logo">
  <img src="./image/MPageLogo.png" alt="Vik logo">
</a>


   

    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/inquiry.html">Inquiry</a>
      <a href="/contact.html">Contact</a>

      <!-- Instagram -->
      <a class="ig-link" href="https://www.instagram.com/YOUR_USERNAME" target="_blank" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm10 2a3 3 0 013 3v10a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3h10zm-5 3.5A4.5 4.5 0 1016.5 12 4.5 4.5 0 0012 7.5zm0 7.4A2.9 2.9 0 1114.9 12 2.9 2.9 0 0112 14.9zm4.7-8.1a1.1 1.1 0 11-1.1-1.1 1.1 1.1 0 011.1 1.1z"/>
        </svg>
      </a>
    </nav>
  </div>
</header> 

<section class="hero">

  <button class="img-btn tl"
    style="background-image:url('image/assets/asset4.png')"
    aria-label="Paintings"></button>

  <button class="img-btn tr"
    style="background-image:url('image/assets/asset3.png')"
    aria-label="Illustrations"></button>

  <h2 class="glow-text">Hey,<br>I’m Vic</h2>

  <button class="img-btn bl"
    style="background-image:url('image/assets/asset2.png')"
    aria-label="Design"></button>

  <button class="img-btn br"
    style="background-image:url('image/assets/asset1.png')"
    aria-label="Tattoo"></button>

</section>

</body>
</html>
